name: Migrate shared briefing data

on:
  push:
    branches:
      - agent/phase1-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[shared-data-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase1-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip if already migrated
        id: state
        run: |
          if [ -f data/briefing-data.js ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate canonical shared data
        if: steps.state.outputs.needed == 'true'
        run: node scripts/migrate-shared-data.mjs

      - name: Validate migrated scripts
        if: steps.state.outputs.needed == 'true'
        run: |
          node --check app.js
          node --check v1-map/app.js
          node --check data/briefing-data.js
          node --check data-validator.js
          node --test tests/*.test.js
          grep -q 'window.BRIEFING_DATA.terms' app.js
          grep -q 'window.BRIEFING_DATA.sources' app.js
          grep -q 'window.BRIEFING_DATA.issues' app.js
          grep -q 'window.BRIEFING_DATA.sources' v1-map/app.js
          grep -q 'window.BRIEFING_DATA.cards' v1-map/app.js

      - name: Commit migrated files
        if: steps.state.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js v1-map/app.js index.html v1-map/index.html data/briefing-data.js
          git commit -m "Centralize briefing data [shared-data-migrated]"
          git push origin HEAD:agent/phase1-hardening

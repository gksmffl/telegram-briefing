name: Migrate shared briefing data

on:
  pull_request:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate canonical shared data
        run: node scripts/migrate-shared-data.mjs

      - name: Validate migrated scripts
        run: |
          node --check app.js
          node --check v1-map/app.js
          node --check data/briefing-data.js
          node --check data-validator.js
          node --test tests/*.test.js
          grep -q 'window.BRIEFING_DATA.terms' app.js
          grep -q 'window.BRIEFING_DATA.sources' app.js
          grep -q 'window.BRIEFING_DATA.issues' app.js
          grep -q 'window.BRIEFING_DATA.sources' v1-map/app.js
          grep -q 'window.BRIEFING_DATA.cards' v1-map/app.js

      - name: Package migrated files
        run: |
          mkdir -p migrated/v1-map migrated/data
          cp app.js migrated/app.js
          cp index.html migrated/index.html
          cp v1-map/app.js migrated/v1-map/app.js
          cp v1-map/index.html migrated/v1-map/index.html
          cp data/briefing-data.js migrated/data/briefing-data.js

      - name: Upload migrated files
        uses: actions/upload-artifact@v4
        with:
          name: shared-data-migration
          path: migrated
          if-no-files-found: error

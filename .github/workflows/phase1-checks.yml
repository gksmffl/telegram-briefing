name: Phase 1 checks

on:
  pull_request:
  push:
    branches:
      - agent/phase1-hardening

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check application scripts
        run: |
          node --check app.js
          node --check v1-map/app.js
          node --check data/channels.js
          node --check data/briefing-data.js
          node --check shared-storage.js
          node --check safe-render.js
          node --check data-validator.js
          node --check phase1-hardening.js
          node --check tests/phase1-hardening.test.js
          node --check tests/shared-guardrails.test.js
          node --check tests/briefing-data.test.js

      - name: Run regression tests
        run: node --test tests/*.test.js

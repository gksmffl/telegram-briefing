name: Refactor rich text

on:
  push:
    branches:
      - agent/phase1-hardening

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[rich-text-refactored]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply explicit renderer refactor
        run: node scripts/refactor-rich-text.mjs
      - name: Validate refactored scripts
        run: |
          node --check app.js
          node --check v1-map/app.js
          ! grep -R "\.innerHTML[[:space:]]*=" app.js v1-map/app.js
      - name: Commit refactored apps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js v1-map/app.js
          git commit -m "Use explicit rich-text renderer [rich-text-refactored]"
          git push origin HEAD:agent/phase1-hardening
